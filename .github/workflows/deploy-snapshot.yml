name: Deploy Snapshot

on:
  push:
    branches: [ develop ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-snapshot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> block for the repository
          # id `github` used by the `github-ci` profile in pom.xml. The default
          # env-var names (GITHUB_ACTOR / GITHUB_TOKEN) are auto-provided by
          # GitHub Actions, so no extra secrets are needed.
          server-id: github

      - name: Resolve project version
        id: ver
        # A release commit carries a non-SNAPSHOT version, and the `github-ci`
        # profile only declares a <snapshotRepository>. Deploying such a version
        # fails with "repository element was not specified in the POM inside
        # distributionManagement". Skip instead of failing: a job called
        # "deploy snapshot" has nothing to do for a release.
        run: echo "version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Deploy snapshot to GitHub Packages
        if: endsWith(steps.ver.outputs.version, '-SNAPSHOT')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress clean deploy -DskipTests
