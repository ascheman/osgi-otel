name: Build

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Generates a fresh settings.xml in the workspace with a <server id="github">
          # (username=GITHUB_ACTOR, password=GITHUB_TOKEN, both auto-provided), so the
          # deploy step can authenticate against GitHub Packages.
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Test Results
          # Only the per-test JUnit reports; NOT failsafe-summary.xml, which is a
          # summary file (not a JUnit report) that crashes dorny/test-reporter.
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit

      - name: Deploy to GitHub Packages
        # Publish snapshots only from main pushes, not from PRs or feature branches.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -s "${{ github.workspace }}/settings.xml" deploy -DskipTests
