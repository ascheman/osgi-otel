name: Build

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The sample launchers are not part of the Maven reactor, so `mvnw verify`
  # says nothing about them. Without this job their 300+ lines of shell - the
  # agent wiring every user starts the extension through - are the only
  # unverified logic in the repository.
  lint-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the sample launchers
        # -S warning on purpose: style-level findings are advice, not a reason
        # to fail the build. Raise it if the scripts ever get noisy.
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          for script in samples/*.sh; do
            bash -n "$script"
          done
          shellcheck -S warning samples/*.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Test Results
          # Only the per-test JUnit reports; NOT failsafe-summary.xml, which is a
          # summary file (not a JUnit report) that crashes dorny/test-reporter.
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
